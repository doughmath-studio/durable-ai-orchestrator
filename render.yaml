# Render Blueprint: бесплатный веб-сервис с панелью (main.py).
# Ключи нейросетей вводятся в Render при создании (sync: false) и в репозиторий не попадают.
services:
  - type: web
    name: ai-orchestrator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
