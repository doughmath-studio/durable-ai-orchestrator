# PROFIT ENGINE: tests + Worker bundle check on every change in profit-engine/.
name: profit-engine-tests

on:
  push:
    paths: ["profit-engine/**", ".github/workflows/profit-engine-*.yml"]
  pull_request:
    paths: ["profit-engine/**", ".github/workflows/profit-engine-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: profit-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
