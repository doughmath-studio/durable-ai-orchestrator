# PROFIT ENGINE: deploy to Cloudflare (Free plan). Runs ONLY when the owner presses "Run workflow".
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RUN_TOKEN.
# Secret values are never printed (the repository is public, so are its logs).
name: profit-engine-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profit-engine-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: profit-engine
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check that secrets exist (values are not shown)
        env:
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ ${#RUN_TOKEN} -ge 20 ] || missing="$missing RUN_TOKEN(min-20-chars)"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi
      - run: npm ci
      - run: npm test
      - name: Find or create the D1 database (free)
        run: |
          get_id() { npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="profit-engine");process.stdout.write(d?(d.uuid||d.database_id||d.id||""):"")'; }
          ID="$(get_id)"
          if [ -z "$ID" ]; then npx wrangler d1 create profit-engine >/dev/null; ID="$(get_id)"; fi
          [ -n "$ID" ] || { echo "::error::Could not find or create D1 database"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.toml
          echo "D1 database: profit-engine ($ID)"
      - name: Apply D1 schema
        run: npx wrangler d1 migrations apply profit-engine --remote
      - name: Deploy Worker
        run: npx wrangler deploy | tee deploy.log
      - name: Set RUN_TOKEN secret
        env:
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: printf '%s' "$RUN_TOKEN" | npx wrangler secret put RUN_TOKEN >/dev/null && echo "RUN_TOKEN set"
      - name: Check /health
        run: |
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "Worker URL: $URL"
          [ -n "$URL" ] || { echo "::warning::workers.dev URL not found in deploy output"; exit 0; }
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::/health did not answer"; exit 1
